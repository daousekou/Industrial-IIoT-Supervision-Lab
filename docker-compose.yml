services:
  nodered:
    image: nodered/node-red:latest
    container_name: industrial_lab_nodered
    ports:
      - "127.0.0.1:1880:1880"
    volumes:
      - nodered_data:/data
    restart: unless-stopped
    networks:
      - industrial-net

  mosquitto:
    image: eclipse-mosquitto:2
    container_name: industrial_lab_mosquitto
    ports:
      - "127.0.0.1:1883:1883"
    volumes:
      - ./mosquitto/config:/mosquitto/config:ro
      - mosquitto_data:/mosquitto/data
      - mosquitto_log:/mosquitto/log
    restart: unless-stopped
    networks:
      - industrial-net

  opcplc:
    image: mcr.microsoft.com/iotedge/opc-plc:latest
    container_name: industrial_lab_opcplc
    hostname: opcplc
    ports:
      - "127.0.0.1:50000:50000"
    command:
      - "--pn=50000"
      - "--plchostname=opcplc"
      - "--certdnsnames=opcplc"
      - "--autoaccept"
      - "--sn=5"
      - "--sr=10"
      - "--st=uint"
      - "--fn=5"
      - "--fr=1"
      - "--ft=uint"
      - "--gn=5"
    restart: unless-stopped
    networks:
      - industrial-net

volumes:
  nodered_data:
  mosquitto_data:
  mosquitto_log:

networks:
  industrial-net:
    name: industrial-net
