services:
  nodered:
    image: nodered/node-red:latest
    container_name: industrial_lab_nodered
    ports:
      - "1880:1880"
    volumes:
      - nodered_data:/data
    restart: unless-stopped

  mosquitto:
    image: eclipse-mosquitto:2
    container_name: industrial_lab_mosquitto
    ports:
      - "1883:1883"
    volumes:
      - ./mosquitto/config:/mosquitto/config:ro
      - mosquitto_data:/mosquitto/data
      - mosquitto_log:/mosquitto/log
    restart: unless-stopped

volumes:
  nodered_data:
  mosquitto_data:
  mosquitto_log:
